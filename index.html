<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- Apply saved theme ASAP to avoid flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (!saved) {
          saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', saved);
        window.__savedTheme = saved;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
        window.__savedTheme = 'light';
      }
    })();
  </script>

  <meta name="color-scheme" content="dark light">

  <!-- Open Graph -->
  <meta property="og:title" content="Prakrit Tyagi - Portfolio">
  <meta property="og:description" content="Game Developer & Full Stack Developer. Unity, web, AI/ML projects.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/me/profile.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Theme files — both loaded, scoped by [data-theme] attribute -->
  <link rel="stylesheet" href="css/themes/dark.css?v=4">
  <link rel="stylesheet" href="css/themes/light.css?v=4">

  <!-- Preload fonts so they're ready before first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/base.css?v=4" />
  <link rel="stylesheet" href="css/sections/header.css?v=3" />
  <link rel="stylesheet" href="css/sections/hero.css?v=3" />
  <link rel="stylesheet" href="css/sections/about.css?v=3" />
  <link rel="stylesheet" href="css/sections/experience.css?v=3" />
  <link rel="stylesheet" href="css/sections/projects.css?v=3" />
  <link rel="stylesheet" href="css/sections/reviews.css?v=3" />
  <link rel="stylesheet" href="css/sections/extra.css?v=3" />
  <link rel="stylesheet" href="css/sections/contact.css?v=3" />
  <link rel="stylesheet" href="css/sections/dividers.css?v=3" />

  <!-- Preloader + scrollbar — inlined so they work before external CSS -->
  <style>
    /* Smooth scroll */
    html {
      scroll-behavior: smooth !important;
    }

    /* ===== Preloader ===== */
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--bg-primary, #0f1117);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader__name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      color: var(--text-primary, #ffffff);
      letter-spacing: -0.03em;
      opacity: 0;
      transform: translateY(8px);
      animation: preloaderFadeUp 0.6s ease 0.1s forwards;
    }

    .preloader__name .dot {
      color: var(--accent, #e0a046);
    }

    .preloader__track {
      width: clamp(200px, 30vw, 320px);
      height: 2px;
      background: var(--border-primary, #2a2e3a);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: preloaderFadeUp 0.4s ease 0.3s forwards;
    }

    .preloader__bar {
      height: 100%;
      width: 0%;
      background: var(--accent, #e0a046);
      border-radius: 2px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px var(--accent-glow, rgba(224, 160, 70, 0.3));
    }

    .preloader__status {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted, #666666);
      opacity: 0;
      animation: preloaderFadeUp 0.4s ease 0.4s forwards;
    }

    @keyframes preloaderFadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hide app until ready */
    #app {
      opacity: 0;
      transition: opacity 0.5s ease 0.1s;
    }
    #app.is-ready {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Network particle background — sits behind everything -->
  <canvas id="network-bg" aria-hidden="true"></canvas>

  <noscript>
    <div style="max-width:600px;margin:80px auto;padding:24px;font-family:sans-serif;text-align:center;">
      <h1>Prakrit Tyagi — Portfolio</h1>
      <p>This portfolio requires JavaScript for interactive features. Please enable JavaScript in your browser settings to view the full site.</p>
      <p>Contact: <a href="mailto:prakrittyagi.work@gmail.com">prakrittyagi.work@gmail.com</a></p>
    </div>
  </noscript>

  <!-- Preloader overlay -->
  <div class="preloader" id="preloader">
    <div class="preloader__name">Prakrit Tyagi<span class="dot">.</span></div>
    <div class="preloader__track">
      <div class="preloader__bar" id="preloader-bar"></div>
    </div>
    <div class="preloader__status" id="preloader-status">Loading…</div>
  </div>

  <!-- App container — hidden until fully loaded -->
  <main id="app"></main>

  <script>
    // =========================================================
    // BOOT SEQUENCE — Load everything, then reveal
    // =========================================================
    (async function boot() {
      const app = document.getElementById('app');
      const preloader = document.getElementById('preloader');
      const bar = document.getElementById('preloader-bar');
      const statusEl = document.getElementById('preloader-status');

      // --- Resources to load ---
      const partials = [
        'partials/header.html',
        'partials/sections/about.html',
        'partials/sections/hero.html',
        'partials/sections/experience.html',
        'partials/sections/projects.html',
        'partials/sections/extra.html',
        'partials/sections/reviews.html',
        'partials/sections/contact.html'
      ];

      // Removed dead utility scripts: css.js, dom.js, scroll.js, io.js
      const scripts = [
        'js/utils.js', // Shared utilities (load first)
        'js/modules/network.js', // Particle network background
        'js/modules/header.js',
        'js/modules/hero.js',
        'js/modules/about.js',
        'js/modules/experience.js',
        'js/modules/projects.js',
        'js/modules/contact.js',
        'js/modules/reviews.js',
        'js/modules/extra.js',
        'js/modules/animations.js'
      ];

      const totalSteps = 6; // HTML, CSS, JS, animations, videos, images
      let completed = 0;

      function progress(label, pctOverride) {
        completed++;
        var pct = pctOverride !== undefined ? pctOverride : Math.min(100, Math.round((completed / totalSteps) * 100));
        if (bar) bar.style.width = pct + '%';
        if (statusEl) statusEl.textContent = label;
      }

      // Hold progress for 1 second after completion
      function holdProgress(duration) {
        return new Promise(function(resolve) {
          setTimeout(resolve, duration || 1000);
        });
      }

      // --- Loaders ---
      async function loadPartial(path, target) {
        const res = await fetch(path);
        if (!res.ok) throw new Error('Failed to fetch ' + path);
        target.insertAdjacentHTML('beforeend', await res.text());
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.defer = false;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Failed to load ' + src)); };
          document.body.appendChild(s);
        });
      }

      function waitForFonts() {
        if (document.fonts && document.fonts.ready) {
          return document.fonts.ready;
        }
        return new Promise(function (r) { setTimeout(r, 600); });
      }


      function waitForImages() {
        var images = app.querySelectorAll('img[src]');
        if (!images.length) return Promise.resolve();

        var promises = [];
        images.forEach(function (img) {
          var src = img.getAttribute('src');
          if (!src || !src.startsWith('assets/')) return;
          
          // Force load the image if not already loaded
          if (img.complete && img.naturalWidth > 0) {
            return; // Already loaded
          }
          
          // Create new image to force load
          var loadImg = new Image();
          promises.push(new Promise(function (resolve) {
            loadImg.onload = resolve;
            loadImg.onerror = resolve;
            loadImg.src = src;
          }));
        });

        if (!promises.length) return Promise.resolve();

        return Promise.race([
          Promise.all(promises),
          new Promise(function (r) { setTimeout(r, 10000); }) // 10 second timeout
        ]);
      }

      function waitForVideos() {
        var videoEls = app.querySelectorAll('video');
        if (!videoEls.length) return Promise.resolve();

        var promises = [];
        videoEls.forEach(function (video) {
          var src = video.getAttribute('src') || (video.querySelector('source') && video.querySelector('source').getAttribute('src'));
          if (!src || !src.startsWith('assets/')) return;
          
          // Force load the video
          if (video.readyState >= 2) {
            return; // Already loaded enough
          }
          
          // Set preload and force load
          video.preload = 'auto';
          if (video.readyState === 0) {
            video.load(); // Force reload
          }
          
          promises.push(new Promise(function (resolve) {
            video.addEventListener('canplay', resolve, { once: true });
            video.addEventListener('error', resolve, { once: true });
            // Also try to play to force loading
            video.play().catch(function() {
              // Ignore play errors, just wait for canplay
            });
          }));
        });

        if (!promises.length) return Promise.resolve();

        return Promise.race([
          Promise.all(promises),
          new Promise(function (r) { setTimeout(r, 10000); }) // 10 second timeout
        ]);
      }

      // CSS is loaded synchronously via <link> in <head>, no wait needed

      // --- Boot ---
      try {
        // Stage 1: HTML partials
        progress('Loading HTML…', 16);
        // Load partials in order (insertAdjacentHTML preserves order)
        var partialContents = await Promise.all(partials.map(function(path) {
          return fetch(path).then(function(res) {
            if (!res.ok) throw new Error('Failed to fetch ' + path);
            return res.text();
          });
        }));
        partialContents.forEach(function(html) {
          app.insertAdjacentHTML('beforeend', html);
        });
        await holdProgress(250);

        // Stage 2: CSS (synchronous via <link> tags, already loaded)
        progress('Loading CSS…', 33);

        // Stage 3: JS modules
        progress('Loading JavaScript…', 50);
        for (var j = 0; j < scripts.length; j++) {
          await loadScript(scripts[j]);
        }
        await holdProgress(250);

        // Stage 4: Assets (animations/fonts)
        progress('Loading assets (animations)…', 66);
        await waitForFonts();
        // Wait for any CSS animations to be ready
        await new Promise(function (resolve) {
          requestAnimationFrame(function () {
            requestAnimationFrame(resolve);
          });
        });
        await holdProgress(250);

        // Stage 5: Assets (videos)
        progress('Loading assets (videos)…', 83);
        await waitForVideos();
        await holdProgress(250);

        // Stage 6: Assets (images)
        progress('Loading assets (images)…', 100);
        await waitForImages();
        await holdProgress(250);

        // Consolidate modules under single namespace (#64)
        window.Portfolio = {
          utils: window.utils,
          header: window.headerModule,
          theme: window.themeModule,
          hero: window.heroModule,
          about: window.aboutModule,
          projects: window.projectsModule,
          reviews: window.reviewsModule,
          experience: window.experienceModule,
          contact: window.contactModule
        };

        // Theme finalization (doesn't count as a step)
        if (window.themeModule && window.themeModule.init) {
          window.themeModule.init();
        }

        // Layout pass
        await new Promise(function (resolve) {
          requestAnimationFrame(function () {
            requestAnimationFrame(resolve);
          });
        });

        // --- Reveal ---
        progress('Ready', 100);
        if (bar) bar.style.width = '100%';
        if (statusEl) statusEl.textContent = 'Ready';

        // Brief pause so user sees 100% complete
        await new Promise(function (r) { setTimeout(r, 300); });

        app.classList.add('is-ready');
        preloader.classList.add('is-hidden');

        // Remove preloader from DOM after fade-out
        preloader.addEventListener('transitionend', function () {
          preloader.remove();
        }, { once: true });

        // Safety cleanup if transitionend doesn't fire
        setTimeout(function () {
          if (document.body.contains(preloader)) preloader.remove();
        }, 1000);

        console.log('✅ Site fully loaded!');

      } catch (error) {
        console.error('Boot error:', error);

        // On error: still show the site rather than a blank screen
        app.classList.add('is-ready');
        if (preloader) preloader.classList.add('is-hidden');
      }
    })();
  </script>
</body>
</html>
