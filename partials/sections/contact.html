<!-- CONTACT -->
<section id="contact" class="contact">
  <h2 class="section-title">LET'S TALK</h2>

  <!-- Mailto = zero-backend send. Replace YOUR-EMAIL-HERE with your email -->
  <form class="talk-form" action="mailto:prakrittyagi.work@gmail.com" method="post" enctype="text/plain">
    <p class="tf-intro">
      Whether you're looking to build a new platform, iterate on an existing product, or bring a unique idea to life, I'm here to help.
    </p>

    <label class="tf-label" for="tf-name">Full Name</label>
    <input class="tf-input" id="tf-name" name="Full Name" type="text" placeholder="Your name" required />

    <label class="tf-label" for="tf-email">Email</label>
    <input class="tf-input" id="tf-email" name="Email" type="email" placeholder="you@example.com" required />

    <label class="tf-label" for="tf-subject">Subject</label>
    <input class="tf-input" id="tf-subject" name="Subject" type="text" placeholder="What's this about?" required />

    <label class="tf-label" for="tf-message">Message</label>
    <textarea class="tf-textarea" id="tf-message" name="Message" rows="6" placeholder="Tell me a bit about your project…" required></textarea>

    <button class="tf-submit" type="submit">Send</button>
  </form>
</section>
