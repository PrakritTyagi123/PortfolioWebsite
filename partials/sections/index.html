  <!-- ═══════════════════════════════════════════════════════════
       PALETTE + THEME BOOTSTRAP — runs before any paint
       ═══════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      // ── Palette registry ──
      var PALETTES = [
    { id: "ember-and-ash", name: "Ember & Ash" },
    { id: "electric-indigo", name: "Electric Indigo" },
    { id: "saffron-and-ink", name: "Saffron & Ink" },
    { id: "midnight-teal", name: "Midnight Teal" },
    { id: "neon-magenta", name: "Neon Magenta" },
    { id: "arctic-steel", name: "Arctic Steel" },
    { id: "verdant-night", name: "Verdant Night" },
    { id: "obsidian-crimson", name: "Obsidian & Crimson" }
  ];

      // ── Pick random palette ──
      var pick = PALETTES[Math.floor(Math.random() * PALETTES.length)];

      // ── Resolve theme (dark/light) ──
      var theme;
      try {
        theme = localStorage.getItem('theme');
      } catch (e) {}
      if (theme !== 'dark' && theme !== 'light') {
        theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark' : 'light';
      }

      // ── Apply to <html> before paint ──
      var html = document.documentElement;
      html.setAttribute('data-theme', theme);
      html.setAttribute('data-palette', pick.id);

      // ── Expose to rest of app ──
      window.__savedTheme = theme;
      window.__palette = pick;
      window.__palettes = PALETTES;

      // ── Inject palette CSS <link> tags ──
      var base = 'css/themes/' + pick.id + '/';
      var darkLink = document.createElement('link');
      darkLink.rel = 'stylesheet';
      darkLink.href = base + 'dark.css?v=1';
      darkLink.id = 'palette-dark';
      document.head.appendChild(darkLink);

      var lightLink = document.createElement('link');
      lightLink.rel = 'stylesheet';
      lightLink.href = base + 'light.css?v=1';
      lightLink.id = 'palette-light';
      document.head.appendChild(lightLink);
    })();
  </script>

  <!-- Preloader + scrollbar — inlined so they work before external CSS -->
  <style>
    /* Smooth scroll */
    html {
      scroll-behavior: smooth !important;
    }

    /* ===== Preloader ===== */
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--bg-primary, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader__name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      color: var(--text-primary, #ffffff);
      letter-spacing: -0.03em;
      opacity: 0;
      transform: translateY(8px);
      animation: preloaderFadeUp 0.6s ease 0.1s forwards;
    }

    .preloader__name .dot {
      color: var(--accent, #ff0000);
    }

    .preloader__track {
      width: clamp(200px, 30vw, 320px);
      height: 2px;
      background: var(--border-primary, #333333);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: preloaderFadeUp 0.4s ease 0.3s forwards;
    }

    .preloader__bar {
      height: 100%;
      width: 0%;
      background: var(--accent, #ff0000);
      border-radius: 2px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px var(--accent-glow, rgba(255, 0, 0, 0.4));
    }

    .preloader__status {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted, #666666);
      opacity: 0;
      animation: preloaderFadeUp 0.4s ease 0.4s forwards;
    }

    .preloader__palette {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted, #666666);
      opacity: 0;
      animation: preloaderFadeUp 0.4s ease 0.6s forwards;
    }

    .preloader__palette .palette-accent {
      color: var(--accent, #ff0000);
    }

    @keyframes preloaderFadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hide app until ready */
    #app {
      opacity: 0;
      transition: opacity 0.5s ease 0.1s;
    }
    #app.is-ready {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Network particle background — sits behind everything -->
  <canvas id="network-bg" aria-hidden="true"></canvas>

  <noscript>
    <div style="max-width:600px;margin:80px auto;padding:24px;font-family:sans-serif;text-align:center;">
      <h1>Prakrit Tyagi — Portfolio</h1>
      <p>This portfolio requires JavaScript for interactive features. Please enable JavaScript in your browser settings to view the full site.</p>
      <p>Contact: <a href="mailto:prakrittyagi.work@gmail.com">prakrittyagi.work@gmail.com</a></p>
    </div>
  </noscript>

  <!-- Preloader overlay -->
  <div class="preloader" id="preloader">
    <div class="preloader__name">Prakrit Tyagi<span class="dot">.</span></div>
    <div class="preloader__track">
      <div class="preloader__bar" id="preloader-bar"></div>
    </div>
    <div class="preloader__status" id="preloader-status">Loading…</div>
    <div class="preloader__palette" id="preloader-palette">

  <!-- Inject palette name into preloader -->

  <!-- App container — hidden until fully loaded -->
  <main id="app"></main>

  <script>
    // =========================================================
    // BOOT SEQUENCE — Load everything, then reveal
    // =========================================================
    (async function boot() {
      const app = document.getElementById('app');
      const preloader = document.getElementById('preloader');
      const bar = document.getElementById('preloader-bar');
      const statusEl = document.getElementById('preloader-status');

      // --- Resources to load ---
      const partials = [
        'partials/header.html',
        'partials/sections/about.html',
        'partials/sections/hero.html',
        'partials/sections/experience.html',
        'partials/sections/projects.html',
        'partials/sections/extra.html',
        'partials/sections/reviews.html',
        'partials/sections/contact.html'
      ];

      const scripts = [
        'js/utils.js',
        'js/modules/network.js',
        'js/modules/header.js',
        'js/modules/hero.js',
        'js/modules/about.js',
        'js/modules/experience.js',
        'js/modules/projects.js',
        'js/modules/contact.js',
        'js/modules/reviews.js',
        'js/modules/extra.js',
        'js/modules/animations.js'
      ];

      const totalSteps = 6;
      let completed = 0;

      function progress(label, pctOverride) {
        completed++;
        var pct = pctOverride !== undefined ? pctOverride : Math.min(100, Math.round((completed / totalSteps) * 100));
        if (bar) bar.style.width = pct + '%';
        if (statusEl) statusEl.textContent = label;
      }

      function holdProgress(duration) {
        return new Promise(function(resolve) {
          setTimeout(resolve, duration || 1000);
        });
      }

      async function loadPartial(path, target) {
        const res = await fetch(path);
        if (!res.ok) throw new Error('Failed to fetch ' + path);
        target.insertAdjacentHTML('beforeend', await res.text());
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.defer = false;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('Failed to load ' + src)); };
          document.body.appendChild(s);
        });
      }

      function waitForFonts() {
        if (document.fonts && document.fonts.ready) {
          return document.fonts.ready;
        }
        return new Promise(function (r) { setTimeout(r, 600); });
      }

      function waitForImages() {
        var images = app.querySelectorAll('img[src]');
        if (!images.length) return Promise.resolve();
        var promises = [];
        images.forEach(function (img) {
          var src = img.getAttribute('src');
          if (!src || !src.startsWith('assets/')) return;
          if (img.complete && img.naturalWidth > 0) return;
          var loadImg = new Image();
          promises.push(new Promise(function (resolve) {
            loadImg.onload = resolve;
            loadImg.onerror = resolve;
            loadImg.src = src;
          }));
        });
        if (!promises.length) return Promise.resolve();
        return Promise.race([
          Promise.all(promises),
          new Promise(function (r) { setTimeout(r, 10000); })
        ]);
      }

      function waitForVideos() {
        var videoEls = app.querySelectorAll('video');
        if (!videoEls.length) return Promise.resolve();
        var promises = [];
        videoEls.forEach(function (video) {
          var src = video.getAttribute('src') || (video.querySelector('source') && video.querySelector('source').getAttribute('src'));
          if (!src || !src.startsWith('assets/')) return;
          if (video.readyState >= 2) return;
          video.preload = 'auto';
          if (video.readyState === 0) video.load();
          promises.push(new Promise(function (resolve) {
            video.addEventListener('canplay', resolve, { once: true });
            video.addEventListener('error', resolve, { once: true });
            video.play().catch(function() {});
          }));
        });
        if (!promises.length) return Promise.resolve();
        return Promise.race([
          Promise.all(promises),
          new Promise(function (r) { setTimeout(r, 10000); })
        ]);
      }

      try {
        progress('Loading HTML…', 16);
        var partialContents = await Promise.all(partials.map(function(path) {
          return fetch(path).then(function(res) {
            if (!res.ok) throw new Error('Failed to fetch ' + path);
            return res.text();
          });
        }));
        partialContents.forEach(function(html) {
          app.insertAdjacentHTML('beforeend', html);
        });
        await holdProgress(250);

        progress('Loading CSS…', 33);

        progress('Loading JavaScript…', 50);
        for (var j = 0; j < scripts.length; j++) {
          await loadScript(scripts[j]);
        }
        await holdProgress(250);

        progress('Loading assets (animations)…', 66);
        await waitForFonts();
        await new Promise(function (resolve) {
          requestAnimationFrame(function () {
            requestAnimationFrame(resolve);
          });
        });
        await holdProgress(250);

        progress('Loading assets (videos)…', 83);
        await waitForVideos();
        await holdProgress(250);

        progress('Loading assets (images)…', 100);
        await waitForImages();
        await holdProgress(250);

        window.Portfolio = {
          utils: window.utils,
          header: window.headerModule,
          theme: window.themeModule,
          hero: window.heroModule,
          about: window.aboutModule,
          projects: window.projectsModule,
          reviews: window.reviewsModule,
          experience: window.experienceModule,
          contact: window.contactModule
        };

        if (window.themeModule && window.themeModule.init) {
          window.themeModule.init();
        }

        await new Promise(function (resolve) {
          requestAnimationFrame(function () {
            requestAnimationFrame(resolve);
          });
        });

        progress('Ready', 100);
        if (bar) bar.style.width = '100%';
        if (statusEl) statusEl.textContent = 'Ready';

        await new Promise(function (r) { setTimeout(r, 300); });

        app.classList.add('is-ready');
        preloader.classList.add('is-hidden');

        preloader.addEventListener('transitionend', function () {
          preloader.remove();
        }, { once: true });

        setTimeout(function () {
          if (document.body.contains(preloader)) preloader.remove();
        }, 1000);

        console.log('✅ Site fully loaded! Palette:', window.__palette.name);

      } catch (error) {
        console.error('Boot error:', error);
        app.classList.add('is-ready');
        if (preloader) preloader.classList.add('is-hidden');
      }
    })();
  </script>
</body>
