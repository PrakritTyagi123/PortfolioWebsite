<!-- Apply saved theme ASAP -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (!saved) {
        saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', saved);
      window.__savedTheme = saved;
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
      window.__savedTheme = 'light';
    }
  })();
</script>

<meta name="color-scheme" content="dark light">

<link id="theme-light" rel="stylesheet" href="css/themes/light.css?v=3" data-theme="light" disabled>
<link id="theme-dark"  rel="stylesheet" href="css/themes/dark.css?v=3"  data-theme="dark"  disabled>

<script>
  (function () {
    var t = window.__savedTheme || 'light';
    var light = document.getElementById('theme-light');
    var dark  = document.getElementById('theme-dark');
    if (light && dark) {
      light.disabled = (t !== 'light');
      dark.disabled  = (t !== 'dark');
    }
  })();
</script>
